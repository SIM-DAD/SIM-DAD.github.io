<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 24" fill="currentColor" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
  <!-- SIM DAD parent ornament: classic typographic flourish — rule with a centered diamond -->
  <line x1="0"  y1="12" x2="50" y2="12" stroke-width="1" opacity="0.55" fill="none"/>
  <line x1="70" y1="12" x2="120" y2="12" stroke-width="1" opacity="0.55" fill="none"/>
  <!-- centered diamond -->
  <g transform="translate(60, 12)">
    <path d="M0 -7 L7 0 L0 7 L-7 0 Z" fill="currentColor"/>
    <circle cx="0" cy="0" r="1.5" fill="none" stroke="white" stroke-width="0.75" opacity="0.4"/>
  </g>
</svg>
